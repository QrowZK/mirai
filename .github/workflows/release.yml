name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fallback: dispatching with a version builds the installer and
  # creates the vX.X.X tag + release from the workflow itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v, e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      RUSTUP_WINDOWS_PATH_ADD_BIN: 1
      # Servo's repo contains WPT paths longer than MAX_PATH; the git CLI
      # honors core.longpaths where cargo's built-in git does not.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --global core.longpaths true

      - name: Install MozTools (required to build SpiderMonkey)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/servo/servo-build-deps/releases/download/msvc-deps/moztools-4.0.zip" -OutFile moztools.zip
          Expand-Archive moztools.zip -DestinationPath C:\moztools-build
          "MOZTOOLS_PATH=C:\moztools-build\moztools-4.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install GStreamer (runtime + development)
        shell: pwsh
        run: |
          $deps = "https://github.com/servo/servo-build-deps/releases/download/msvc-deps"
          Invoke-WebRequest -Uri "$deps/gstreamer-1.0-msvc-x86_64-1.22.8.msi" -OutFile gstreamer.msi
          Invoke-WebRequest -Uri "$deps/gstreamer-1.0-devel-msvc-x86_64-1.22.8.msi" -OutFile gstreamer-devel.msi
          Start-Process msiexec -ArgumentList "/i", "gstreamer.msi", "/qn", "ADDLOCAL=ALL" -Wait
          Start-Process msiexec -ArgumentList "/i", "gstreamer-devel.msi", "/qn", "ADDLOCAL=ALL" -Wait
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
          cache-all-crates: true

      - name: Build release binary
        run: cargo build -p mirai --release --features media

      - name: Stage GStreamer runtime for the installer
        shell: pwsh
        run: .\installer\stage-gstreamer.ps1

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          iscc /DAppVersion=${{ steps.version.outputs.version }} installer\mirai.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiraiSetup-${{ steps.version.outputs.version }}
          path: installer/Output/MiraiSetup-*.exe

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: installer/Output/MiraiSetup-*.exe
          generate_release_notes: true
