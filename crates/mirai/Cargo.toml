[package]
name = "mirai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mirai: an extremely lightweight, privacy-focused browser built on Servo"

[dependencies]
mirai-privacy = { path = "../mirai-privacy" }
libservo = { workspace = true }
winit = { workspace = true }
euclid = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }
log = { workspace = true }
# Must match the version pinned by our Servo revision, since `Destination` in
# WebResourceRequest comes from this crate.
content-security-policy = "0.8.1"
