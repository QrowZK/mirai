[package]
name = "mirai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mirai: an extremely lightweight, privacy-focused browser built on Servo"

[dependencies]
mirai-privacy = { path = "../mirai-privacy" }
libservo = { workspace = true }
winit = { workspace = true }
euclid = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }
log = { workspace = true }
# Must match the version pinned by our Servo revision, since `Destination` in
# WebResourceRequest comes from this crate.
content-security-policy = "0.8.1"
egui = { workspace = true }
egui-winit = { workspace = true }
egui_glow = { workspace = true }
glow = { workspace = true }

[features]
default = []
# Video/audio playback via GStreamer. Requires the GStreamer development
# libraries at build time and the runtime at run time.
media = ["libservo/media-gstreamer"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

